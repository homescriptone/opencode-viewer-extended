[package]
name = "opencode-viewer-extender"
version = "1.1.0"
description = "Local GUI to browse, edit, and export OpenCode sessions"
authors = ["homescriptone"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
