name: Desktop (Tauri)

on:
  push:
    tags: ["v*"]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            echo "tag ${TAG} — building"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            TAG="v$(node -p "require('./package.json').version")"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release ${TAG} already exists — skipping build"
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              echo "release ${TAG} missing — building"
              echo "build=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            ext: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
            ext: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            ext: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bun_target: bun-windows-x64
            ext: ".exe"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build server sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          bun build --compile --target=${{ matrix.bun_target }} server/launch.ts \
            --outfile "src-tauri/binaries/ocv-server-${{ matrix.target }}${{ matrix.ext }}"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.gate.outputs.tag }}
          releaseName: "OpenCode Viewer __VERSION__"
          releaseBody: "See the assets to download this version and install. Unsigned builds — expect a Gatekeeper/SmartScreen warning on first launch."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload installers as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocv-desktop-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
